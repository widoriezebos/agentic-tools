metasystem.version=1
# The engine ships as source and CI rebuilds it (D17/D33). This key is
# REQUIRED: a missing key reads as damage, never as a mode.
metasystem.engine-delivery=source
metasystem.runtimes=claude,codex,devin
# Tailored application testing policy. Delivery reads only this committed path.
testing.contract=testing.json
# A machine sets its own interface port in the .local file.
# ui.listen=127.0.0.1:7878
# The name the interface gives this workspace; empty names the template itself
# when self-hosted, and the checkout otherwise.
# ui.subject=
# How long a browser session a human signed into with the seat's one-time code
# lasts, in whole hours. Twelve is the default.
# ui.session.hours=12
# The handle the interface signs in as when no enrolled terminal started it.
# Unset, the sign-in sheet asks once and the server keeps the answer. The code
# itself is channel.human.totp-secret, which lives in the .local file only.
# ui.human=
# The Project Partner: which agent answers in the drawer. claude, codex or
# devin, and unset — the default — is a seat with no Partner at all. Naming one
# also closes the boot proof's path to the act routes: a seat that runs an
# agent requires a signed-in human for every act, because a local process can
# send a cookie-less request and an agent request must never become a human
# act. The Partner reads this checkout and nothing else: it has no shell, no
# network, no MCP server, and no approval inherited from this seat's own
# settings.
# ui.partner.runtime=
# The model the Partner's session runs. Unset is the runtime's own default.
# A model the runtime cannot select refuses the turn with the runtime's words.
# ui.partner.model=
# How to start one runtime's ACP server, as a command line. Unset is the
# runtime's published entry point on PATH: claude-agent-acp from
# @agentclientprotocol/claude-agent-acp, codex-acp from
# @agentclientprotocol/codex-acp, and `devin acp` from the Devin CLI.
# ui.partner.command.claude=
# ui.partner.command.codex=
# ui.partner.command.devin=
# Total adapter-worker allowance for one test attempt. When absent, the engine
# captures GOMAXPROCS once and divides it by the resolved top-level proof
# admission maximum (treating unlimited admission as one), with a floor of one.
# Any explicit value must be positive; there is no arbitrary machine-size cap
# at top level. A positive inherited METASYSTEM_TEST_WORKERS is always a nested
# cooperative ceiling; a malformed or non-positive inherited value is refused.
# testing.workers=4
runtime.claude.maximal-models=claude-fable-5-1
# Family pointer (R-71-m3): the source id MEANS the target at resolution; moved only by landing this line on Wido's word.
runtime.claude.model-alias.claude-fable-5=claude-fable-5-1
# Admission closes at the goal limit; breach-stop waits this percentage longer.
metasystem.budget.elapsed-grace-percent=50
metasystem.budget.slice-norm-hours=4
# Decision 06, R-42-m0: three review rounds is the ceiling; 0 removes it.
metasystem.budget.review-round-max=3
metasystem.budget.tier-1=1h/3/360m/1/0
metasystem.budget.tier-2=4h/6/720m/1/2
metasystem.budget.tier-3=8h/10/1200m/1/3
metasystem.budget.carry-open-max=1
steward.ledger-attention-stale-minutes=30
# A tick may take this long before the resident runner is considered stuck.
steward.tick-patience-sec=120
# A Stop using this many seconds of its shipped sixty-second budget is unhealthy.
steward.stop-slow-sec=15
# Spend accounting is alert-only. Uncomment ceilings to override the shipped
# defaults; prices use spend.price.<runtime>.<canonical-model>.<class> and are
# deliberately absent until Wido records the model rates.
# spend.mode=alert
# spend.currency=USD
# spend.ceiling.day.tokens=250000000
# spend.ceiling.day.money=750
# spend.ceiling.goal.tokens=125000000
# spend.ceiling.goal.money=300
# Context trigger 105000 starts handoff; construction refuses a trigger above 106638.
context.ceiling.tokens=250000
context.handoff.margin.tokens=145000
context.toolgate.mode=observe
# Claude defaults to its project memory directory. Other runtimes name an
# absolute directory before they record a handoff.
# context.handoff.note-directory.codex=/absolute/path/to/runtime-memory
# Wido's pending one-word choice activates A, B, or C. Empty means that no
# correlation policy may affect work.
metasystem.governance.correlation-policy=C
validation.weight-threshold=60
metasystem.counselor.brief-cadence-hours=24

retro.max-receipts=25
retro.max-age-days=30
refactor.max-age-minutes=1440
refactor.max-commits=40
watch.stale-min=20
watch.cap-min=180
watch.interval-sec=60
suite.progress-silence-min=30
suite.section-cap-min=45
suite.evidence-copy-timeout-sec=60
suite.evidence-copy-max-mb=512
# Host-wide cap on concurrent top-level proof attempts (temporary, ruling R-111-m1e): unset means
# max(1, cores/6) on this host, 0 disables it, and a seat pins a value in metasystem.conf.local.
# It expires with tests-never-wait-on-wall-time units 1e, 2, 3b and
# engine-policy-binding-survives-drift-and-load units U4a and U4b.
# proof.admission.top-level-max=3
census.log-max-bytes=1048576
census.max-interval-share-percent=50
dispatch.cap-min=120
# Decision 14, R-58-m1: bound every reservation so the goal pool remains a runaway guard.
dispatch.cap-max=120
# Raised from 64 on 2026-09-20 on Wido's word. behavior-judge,
# steward-continuation and implementer had each grown past 65536 bytes on their
# recipe sources alone and refused with REFUSED-INLINE-INPUT-LIMIT before any
# work started, because docs/orchestration.md reached 60773 bytes and is their
# required skill. The spill loop cannot relocate a role's own sources
# (internal/dispatch/composition.go:292 omits the eligible flag that :295 sets
# for caller bodies), so there was nothing left to shed and dispatch refused.
# This unblocks switch-on; it does not stop the next document from crossing.
# The real fix is goal recipe-sources-spill-like-any-other-section.
dispatch.max-inline-input-kb=80
capability.snapshot-max-age-days=30
# The full tier-one battery may exceed the generic five-minute local bound.
landing.receipt-bound-min=40

# Values that must not ship to adopting projects (a developer's own
# evidence root, or this template repository's own settings) go in an
# uncommitted metasystem.conf.local beside this file. It wins over the keys
# here and loses to environment variables and flags.
evidence.root=<durable evidence root, outside the repository>

# Example model.tier.1=codex:budget-model; configuring it adds the least-cost dispatch rank.
# Example model.tier.2=codex:standard-model; configuring it adds the middle dispatch cost rank.
# Example model.tier.3=codex:premium-model; configuring it adds the highest dispatch cost rank.

role.default.runtime=codex
# No default model ships here: a role that launches without its own model
# entry resolves to role.default.model.<runtime>, which the seat names in
# its uncommitted metasystem.conf.local (config validate and every launch
# refuse a placeholder, naming the key and the command that sets it).
role.design-critic.runtime=codex
role.design-critic.model.codex=<model>
role.implementer.runtime=codex
role.implementer.model.codex=<model>
# DESIGN-BEARING design authoring enforces xhigh, which the Codex adapter passes through.
mode.design.role.implementer.runtime=codex
mode.design.role.implementer.model.codex=gpt-6-astra
# Keep the code critic on a different effective model from the implementer;
# projects accepting weaker isolation must declare independence=session-only.
role.code-critic.runtime=<runtime>
role.code-critic.model.<runtime>=<model>
role.verifier.runtime=main
role.investigator.runtime=main

dispatch.permissions.design-critic=critic
dispatch.permissions.code-critic=critic
dispatch.permissions.investigator=none
dispatch.permissions.implementer=workspace
dispatch.permissions.verifier=workspace

# Example mode.refactor.role.implementer.runtime=devin; configuring it chooses a refactor-only runtime.
# Example mode.refactor.role.implementer.model.devin=devin-model; configuring it chooses a refactor-only model.
# Example mode.improve.role.implementer.model.codex=codex-model; configuring it chooses an improvement-only model.

# Companion suites this project promises at validation (the metasystem
# template itself develops beside its measuring kit; adopted targets
# carry no such sibling and no such key).
validate.extra-suites=../benchmark/evidence-drift-fixtures.sh

# THE FLIP (D82, executed 2026-08-24 on Wido's flip-on-valid-green word):
# ACP is the Devin transport default. The sealed bm-2d cohort's rep 1
# rescored VALID with every transport-health gate green under the
# corrected measuring kit (benchmark/results/89b2509.../1.json); the
# dangerous-mode waiver retires with the legacy default. An absent key
# still resolves legacy in the adapter for pre-flip configurations;
# explicit legacy remains selectable, and the graded-permission
# verification rides devin-subagent-permission-probe.
dispatch.transport.devin=acp

# NO CONTEXT CAP IS IMPOSED. 0 means this lane inherits whatever context window
# its runtime gives that model; neither adapter emits a cap argument at 0.
# Set to 0 on 2026-09-20 on Wido's word, because the cap was a single absolute
# token count applied across runtimes whose windows differ five-fold, so one
# number could not be right for all of them: Codex reports
# model_context_window=258400 for gpt-5.6-sol and gpt-6-astra alike, while Fable
# sessions in this fleet have actually run at about 1000000. A 200000 lane was
# therefore a five-fold cut on Fable, and a 400000 lane would have been an
# impossible number on Codex. Measured across 629 automatic compactions in every
# local transcript, a harness compacts at about its window minus 34000 tokens
# whatever the window, so the cap bought no safety margin that the runtime does
# not already keep for itself. Put a positive number back here only for a lane
# that needs a DIFFERENT window from its runtime default, and name the model it
# is chosen for.
launch.seat.window.tokens=0
launch.build.window.tokens=0
launch.design.window.tokens=0
launch.read.window.tokens=0
launch.build.model=gpt-6-sol
launch.build.effort=xhigh
launch.design.model=claude-fable-5-1
launch.read.model=claude-opus-5-5[1m]
launch.wait.cap.seconds=240
# No lane imposes a window any more, so this cap is sized against the SMALLEST window a lane actually runs in, which is Codex at model_context_window=258400: a full brief leaves about 138000 tokens for tool output and the diff.
launch.brief.admitted.tokens=120000
launch.build.max.changed.lines=1500
launch.read.split.diff.lines=1200
launch.design.baseline.tokens=2432374
launch.design.baseline.requests=28
launch.design.baseline.peak.tokens=163000
