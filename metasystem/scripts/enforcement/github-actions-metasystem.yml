# Shipped enforcement: copy to .github/workflows/metasystem.yml during adaptation.
# Runs the metasystem hard checks on every push and pull request so they do not
# depend on anyone remembering to run them. Installs ripgrep, which the audit
# hard-requires.
name: metasystem
on: [push, pull_request]
jobs:
  metasystem-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Metasystem validation
        run: bash scripts/validate-metasystem.sh
