# Shipped enforcement: copy to .github/workflows/metasystem.yml during adaptation.
# Runs the metasystem hard checks on every push and pull request so they do not
# depend on anyone remembering to run them.
name: metasystem
on: [push, pull_request]
jobs:
  metasystem-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The payload ships the engine source (D17); CI builds it with the
      # toolchain the go.mod pins.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the engine
        run: go build -o bin/metasystem ./cmd/metasystem
      # The testing contract is the checkout's proof; system check also judges
      # live supervision, which a CI runner never arms.
      - name: Metasystem checks
        run: bin/metasystem test run
