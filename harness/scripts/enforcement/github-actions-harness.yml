# Shipped enforcement: copy to .github/workflows/harness.yml during adaptation.
# Runs the harness hard checks on every push and pull request so they do not
# depend on anyone remembering to run them. Installs ripgrep, which the audit
# hard-requires.
name: harness
on: [push, pull_request]
jobs:
  harness-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Harness validation
        run: bash scripts/validate-harness.sh
